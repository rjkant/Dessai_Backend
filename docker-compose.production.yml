# Dessai Backend - Docker Compose Configuration
# Production-ready multi-service setup with monitoring and observability

version: '3.8'

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  dessai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  monitoring:
    driver: bridge
  database:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  elasticsearch-data:
    driver: local
  app-logs:
    driver: local

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ===========================================================================
  # APPLICATION SERVICES
  # ===========================================================================
  
  # Main Dessai Backend API
  dessai-api:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    container_name: dessai-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://dessai:dessai_secure_password@postgres:5432/dessai?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-this}
      - BCRYPT_SALT_ROUNDS=12
      - SESSION_SECRET=${SESSION_SECRET:-your-session-secret-change-this}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001}
      - LOG_LEVEL=info
      - PROMETHEUS_METRICS=true
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dessai-network
      - database
      - monitoring
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Code Execution Service (Isolated)
  dessai-execution:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    container_name: dessai-execution
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVICE_NAME=execution-service
      - REDIS_URL=redis://redis:6379
      - SANDBOX_ENABLED=true
      - EXECUTION_TIMEOUT=30000
      - MAX_MEMORY=512MB
      - ALLOWED_LANGUAGES=javascript,python,java,cpp,csharp,go,rust,swift,kotlin,scala,typescript,php
    depends_on:
      - redis
    networks:
      - dessai-network
      - monitoring
    volumes:
      - app-logs:/app/logs
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # WebRTC Proctoring Service
  dessai-proctoring:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    container_name: dessai-proctoring
    restart: unless-stopped
    ports:
      - "3002:3000"
      - "8080:8080" # WebRTC signaling
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVICE_NAME=proctoring-service
      - REDIS_URL=redis://redis:6379
      - WEBRTC_PORT=8080
      - STUN_SERVERS=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      - TURN_SERVERS=${TURN_SERVERS:-}
      - RECORDING_ENABLED=true
      - STORAGE_PATH=/app/recordings
    depends_on:
      - redis
    networks:
      - dessai-network
      - monitoring
    volumes:
      - ./recordings:/app/recordings
      - app-logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.8'
          memory: 800M

  # ===========================================================================
  # DATABASE SERVICES
  # ===========================================================================
  
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dessai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=dessai
      - POSTGRES_USER=dessai
      - POSTGRES_PASSWORD=dessai_secure_password
      - POSTGRES_INITDB_ARGS="--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dessai -d dessai"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis Cache and Session Store
  redis:
    image: redis:7-alpine
    container_name: dessai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec 
      --maxmemory 512mb 
      --maxmemory-policy allkeys-lru
      --requirepass dessai_redis_password
    volumes:
      - redis-data:/data
    networks:
      - dessai-network
      - database
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # ===========================================================================
  # MONITORING AND OBSERVABILITY
  # ===========================================================================
  
  # Prometheus Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: dessai-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
    depends_on:
      - dessai-api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: dessai-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=dessai_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # Elasticsearch for Log Management
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: dessai-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Kibana for Log Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: dessai-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # Jaeger Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: dessai-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Jaeger UI
      - "14268:14268" # HTTP collector
      - "6831:6831/udp" # UDP collector
      - "6832:6832/udp" # UDP collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # ===========================================================================
  # REVERSE PROXY AND LOAD BALANCER
  # ===========================================================================
  
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: dessai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - dessai-api
      - grafana
    networks:
      - dessai-network
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ===========================================================================
  # DEVELOPMENT TOOLS (Comment out for production)
  # ===========================================================================
  
  # Redis Commander (Development)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: dessai-redis-commander
    restart: unless-stopped
    profiles:
      - development
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:dessai_redis_password
    depends_on:
      - redis
    networks:
      - dessai-network

  # pgAdmin (Development)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dessai-pgadmin
    restart: unless-stopped
    profiles:
      - development
    ports:
      - "8080:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@dessai.ai
      - PGADMIN_DEFAULT_PASSWORD=dessai_admin_password
    depends_on:
      - postgres
    networks:
      - database
