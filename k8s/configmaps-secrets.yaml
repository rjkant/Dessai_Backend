# Dessai Backend - Kubernetes ConfigMaps and Secrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: dessai-config
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai
    app.kubernetes.io/component: config
data:
  # Application Configuration
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  
  # Service Configuration
  SERVICE_NAME: "dessai-api"
  API_VERSION: "v1"
  
  # Database Configuration
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "dessai"
  DATABASE_SCHEMA: "public"
  
  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # Security Configuration
  BCRYPT_SALT_ROUNDS: "12"
  SESSION_TIMEOUT: "3600"
  JWT_EXPIRY: "15m"
  JWT_REFRESH_EXPIRY: "7d"
  
  # CORS Configuration
  CORS_ORIGIN: "https://app.dessai.ai,https://admin.dessai.ai"
  CORS_METHODS: "GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS"
  CORS_CREDENTIALS: "true"
  
  # Rate Limiting
  RATE_LIMIT_WINDOW: "60000"
  RATE_LIMIT_MAX: "100"
  
  # Monitoring Configuration
  PROMETHEUS_METRICS: "true"
  PROMETHEUS_PORT: "9090"
  HEALTH_CHECK_PATH: "/api/health"
  
  # Logging Configuration
  LOG_FORMAT: "json"
  LOG_TIMESTAMP: "true"
  LOG_REQUEST_ID: "true"
  
  # Integration Configuration
  WEBHOOK_TIMEOUT: "30000"
  SYNC_BATCH_SIZE: "100"
  INTEGRATION_RETRY_COUNT: "3"
  
  # Code Execution Configuration
  EXECUTION_TIMEOUT: "30000"
  MAX_MEMORY: "512MB"
  SANDBOX_ENABLED: "true"
  ALLOWED_LANGUAGES: "javascript,python,java,cpp,csharp,go,rust,swift,kotlin,scala,typescript,php"
  
  # WebRTC Configuration
  WEBRTC_PORT: "8080"
  STUN_SERVERS: "stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"
  RECORDING_ENABLED: "true"
  
  # Jaeger Tracing
  JAEGER_ENDPOINT: "http://jaeger-collector:14268/api/traces"
  JAEGER_SAMPLING_RATE: "0.1"
  
---
# Sensitive configuration secrets
apiVersion: v1
kind: Secret
metadata:
  name: dessai-secrets
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database Credentials
  DATABASE_URL: "postgresql://dessai:dessai_secure_password@postgres-service:5432/dessai?schema=public"
  DATABASE_USER: "dessai"
  DATABASE_PASSWORD: "dessai_secure_password"
  
  # Redis Credentials
  REDIS_URL: "redis://:dessai_redis_password@redis-service:6379"
  REDIS_PASSWORD: "dessai_redis_password"
  
  # JWT Secrets
  JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production-k8s"
  JWT_REFRESH_SECRET: "your-super-secret-refresh-key-change-this-in-production-k8s"
  SESSION_SECRET: "your-session-secret-change-this-in-production-k8s"
  
  # Encryption Keys
  ENCRYPTION_KEY: "your-32-character-encryption-key-here"
  INTEGRATION_SECRET_KEY: "your-integration-encryption-key-here"
  
  # External Service API Keys
  GOOGLE_CLIENT_ID: "your-google-oauth-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-oauth-client-secret"
  MICROSOFT_CLIENT_ID: "your-microsoft-oauth-client-id"
  MICROSOFT_CLIENT_SECRET: "your-microsoft-oauth-client-secret"
  
  # ATS Integration Secrets
  GREENHOUSE_API_KEY: "your-greenhouse-api-key"
  WORKDAY_CLIENT_ID: "your-workday-client-id"
  WORKDAY_CLIENT_SECRET: "your-workday-client-secret"
  BAMBOO_HR_API_KEY: "your-bamboo-hr-api-key"
  
  # Notification Service Secrets
  SENDGRID_API_KEY: "your-sendgrid-api-key"
  TWILIO_ACCOUNT_SID: "your-twilio-account-sid"
  TWILIO_AUTH_TOKEN: "your-twilio-auth-token"
  SLACK_BOT_TOKEN: "your-slack-bot-token"
  
  # Cloud Storage Secrets
  AWS_ACCESS_KEY_ID: "your-aws-access-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key"
  AWS_S3_BUCKET: "dessai-recordings"
  
  # WebRTC TURN Server Credentials
  TURN_SERVER_USERNAME: "dessai-turn-user"
  TURN_SERVER_PASSWORD: "dessai-turn-password"
  
---
# TLS Certificate Secret (for HTTPS)
apiVersion: v1
kind: Secret
metadata:
  name: dessai-tls
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  # Replace these with your actual TLS certificate and private key
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...
  
---
# Service Account for Dessai pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dessai-service-account
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai
    app.kubernetes.io/component: serviceaccount
automountServiceAccountToken: true

---
# Role for Dessai service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dessai-role
  namespace: dessai
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]

---
# Role binding for Dessai service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dessai-role-binding
  namespace: dessai
subjects:
- kind: ServiceAccount
  name: dessai-service-account
  namespace: dessai
roleRef:
  kind: Role
  name: dessai-role
  apiGroup: rbac.authorization.k8s.io
