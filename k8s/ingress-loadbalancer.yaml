---
# Nginx Ingress Controller RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nginx-ingress-controller
  namespace: dessai
  labels:
    app.kubernetes.io/name: nginx-ingress-controller
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nginx-ingress-controller
subjects:
- kind: ServiceAccount
  name: nginx-ingress-controller
  namespace: dessai

---
# Nginx Ingress Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ingress-config
  namespace: dessai
  labels:
    app.kubernetes.io/name: nginx-ingress-controller
    app.kubernetes.io/component: controller
data:
  # SSL configuration
  ssl-protocols: "TLSv1.2 TLSv1.3"
  ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
  ssl-prefer-server-ciphers: "false"
  ssl-session-cache: "shared:SSL:10m"
  ssl-session-timeout: "10m"
  
  # Security headers
  add-headers: "dessai/security-headers"
  
  # Performance
  worker-processes: "auto"
  worker-connections: "1024"
  keepalive-timeout: "65"
  client-max-body-size: "100m"
  proxy-connect-timeout: "60"
  proxy-send-timeout: "60"
  proxy-read-timeout: "60"
  
  # Gzip compression
  enable-gzip: "true"
  gzip-level: "6"
  gzip-types: "text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript"
  
  # Rate limiting
  limit-req-zone: "$binary_remote_addr zone=login:10m rate=5r/m"
  
  # Monitoring
  enable-vts-status: "true"
  vts-status-zone-size: "10m"

---
# Security Headers ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-headers
  namespace: dessai
  labels:
    app.kubernetes.io/name: nginx-ingress-controller
    app.kubernetes.io/component: security
data:
  X-Content-Type-Options: "nosniff"
  X-Frame-Options: "DENY"
  X-XSS-Protection: "1; mode=block"
  Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
  Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:; media-src 'self'; object-src 'none'; child-src 'none'; worker-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; manifest-src 'self'"
  Referrer-Policy: "strict-origin-when-cross-origin"
  Permissions-Policy: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

---
# TCP Services ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: tcp-services
  namespace: dessai
  labels:
    app.kubernetes.io/name: nginx-ingress-controller
    app.kubernetes.io/component: controller
data: {}

---
# UDP Services ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: udp-services
  namespace: dessai
  labels:
    app.kubernetes.io/name: nginx-ingress-controller
    app.kubernetes.io/component: controller
data: {}

---
# Main Dessai Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dessai-ingress
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-ingress
    app.kubernetes.io/component: routing
    app.kubernetes.io/part-of: dessai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.dessai.com
    - app.dessai.com
    secretName: dessai-tls
  rules:
  - host: api.dessai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dessai-api-service
            port:
              number: 3000
  - host: app.dessai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dessai-frontend-service
            port:
              number: 3000

---
# Monitoring Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dessai-monitoring-ingress
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-monitoring-ingress
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: dessai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: "monitoring-basic-auth"
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required - Dessai Monitoring"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - monitoring.dessai.com
    secretName: dessai-monitoring-tls
  rules:
  - host: monitoring.dessai.com
    http:
      paths:
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: prometheus-service
            port:
              number: 9090
      - path: /kibana
        pathType: Prefix
        backend:
          service:
            name: kibana-service
            port:
              number: 5601
      - path: /jaeger
        pathType: Prefix
        backend:
          service:
            name: jaeger-service
            port:
              number: 16686

---
