# Integration Services Monitoring Configuration
# Epic 8: Infrastructure & DevOps - Enhanced Monitoring for Integration Services
#
# This configuration extends the existing Prometheus/Grafana monitoring
# with specific metrics, alerts, and dashboards for Epic 7: Integration Services

---
# Prometheus Rules for Integration Services
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dessai-integration-services-rules
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-integration-services-rules
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: dessai
    epic: "epic-7-integration-services"
    prometheus: dessai
spec:
  groups:
  - name: integration-services.rules
    interval: 30s
    rules:
    # Integration service availability
    - alert: IntegrationServiceDown
      expr: up{job="dessai-integration-services"} == 0
      for: 2m
      labels:
        severity: critical
        epic: "epic-7-integration-services"
        component: "integration-services"
      annotations:
        summary: "Integration service is down"
        description: "Integration service {{ $labels.instance }} has been down for more than 2 minutes."
        runbook_url: "https://docs.dessai.com/runbooks/integration-service-down"
    
    # High error rate for external API calls
    - alert: HighIntegrationAPIErrorRate
      expr: rate(integration_api_requests_total{status=~"4..|5.."}[5m]) / rate(integration_api_requests_total[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
        epic: "epic-7-integration-services"
        component: "external-api"
      annotations:
        summary: "High error rate in integration API calls"
        description: "Error rate for {{ $labels.provider }} API is {{ $value | humanizePercentage }} over the last 5 minutes."
        runbook_url: "https://docs.dessai.com/runbooks/integration-api-errors"
    
    # Greenhouse API rate limiting
    - alert: GreenhouseRateLimitApproaching
      expr: greenhouse_api_rate_limit_remaining < 50
      for: 2m
      labels:
        severity: warning
        epic: "epic-7-integration-services"
        component: "greenhouse-api"
      annotations:
        summary: "Greenhouse API rate limit approaching"
        description: "Greenhouse API rate limit remaining: {{ $value }} requests"
        runbook_url: "https://docs.dessai.com/runbooks/greenhouse-rate-limit"
    
    # Google Calendar OAuth token expiry
    - alert: GoogleCalendarTokenExpiring
      expr: google_calendar_token_expires_in < 3600
      for: 5m
      labels:
        severity: warning
        epic: "epic-7-integration-services"
        component: "google-calendar"
      annotations:
        summary: "Google Calendar OAuth token expiring soon"
        description: "Google Calendar OAuth token expires in {{ $value | humanizeDuration }}"
        runbook_url: "https://docs.dessai.com/runbooks/oauth-token-refresh"
    
    # Integration sync failures
    - alert: IntegrationSyncFailures
      expr: rate(integration_sync_failures_total[10m]) > 0.1
      for: 10m
      labels:
        severity: warning
        epic: "epic-7-integration-services"
        component: "sync"
      annotations:
        summary: "High rate of integration sync failures"
        description: "{{ $labels.provider }} sync failure rate: {{ $value | humanizePercentage }}"
        runbook_url: "https://docs.dessai.com/runbooks/integration-sync-failures"
    
    # Database connection issues
    - alert: IntegrationDatabaseConnectionIssues
      expr: integration_db_connections_failed_total > 5
      for: 5m
      labels:
        severity: critical
        epic: "epic-7-integration-services"
        component: "database"
      annotations:
        summary: "Integration service database connection issues"
        description: "{{ $value }} database connection failures in the last 5 minutes"
        runbook_url: "https://docs.dessai.com/runbooks/database-connection-issues"
    
    # Memory usage high
    - alert: IntegrationServiceHighMemoryUsage
      expr: (container_memory_usage_bytes{pod=~"dessai-integration-services-.*"} / container_spec_memory_limit_bytes) > 0.85
      for: 10m
      labels:
        severity: warning
        epic: "epic-7-integration-services"
        component: "resources"
      annotations:
        summary: "Integration service high memory usage"
        description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.pod }}"
        runbook_url: "https://docs.dessai.com/runbooks/high-memory-usage"
    
    # Response time degradation
    - alert: IntegrationAPISlowResponse
      expr: histogram_quantile(0.95, rate(integration_api_request_duration_seconds_bucket[5m])) > 5
      for: 10m
      labels:
        severity: warning
        epic: "epic-7-integration-services"
        component: "performance"
      annotations:
        summary: "Integration API slow response times"
        description: "95th percentile response time is {{ $value }}s for {{ $labels.endpoint }}"
        runbook_url: "https://docs.dessai.com/runbooks/slow-response-times"

---
# Grafana Dashboard ConfigMap for Integration Services
apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-services-dashboard
  namespace: dessai
  labels:
    app.kubernetes.io/name: integration-services-dashboard
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: dessai
    epic: "epic-7-integration-services"
    grafana_dashboard: "1"
data:
  integration-services-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Dessai Integration Services - Epic 7",
        "tags": ["dessai", "integration-services", "epic-7"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Integration Services Overview",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=\"dessai-integration-services\"}",
                "legendFormat": "Service Status"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "API Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(integration_api_requests_total[5m])",
                "legendFormat": "{{ provider }} - {{ method }}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4}
          },
          {
            "id": 3,
            "title": "External API Response Times",
            "type": "graph", 
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(integration_api_request_duration_seconds_bucket[5m]))",
                "legendFormat": "{{ provider }} - 95th percentile"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4}
          },
          {
            "id": 4,
            "title": "Error Rates by Provider",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(integration_api_requests_total{status=~\"4..|5..\"}[5m])",
                "legendFormat": "{{ provider }} - Errors"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 12}
          },
          {
            "id": 5,
            "title": "Greenhouse API Metrics", 
            "type": "graph",
            "targets": [
              {
                "expr": "greenhouse_api_rate_limit_remaining",
                "legendFormat": "Rate Limit Remaining"
              },
              {
                "expr": "rate(greenhouse_candidates_synced_total[10m])",
                "legendFormat": "Candidates Synced/min"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20}
          },
          {
            "id": 6,
            "title": "Google Calendar OAuth Status",
            "type": "graph", 
            "targets": [
              {
                "expr": "google_calendar_token_expires_in",
                "legendFormat": "Token Expires In (seconds)"
              },
              {
                "expr": "rate(google_calendar_events_created_total[10m])",
                "legendFormat": "Events Created/min"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }

---
# ServiceMonitor for Integration Services Metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dessai-integration-services-metrics
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-integration-services-metrics
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: dessai
    epic: "epic-7-integration-services"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dessai-integration-services
  endpoints:
  - port: integration-api
    path: /api/integrations/metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    # Keep only integration-specific metrics
    - sourceLabels: [__name__]
      regex: '(integration_.*|greenhouse_.*|google_calendar_.*|nodejs_.*|process_.*)'
      action: keep
    # Add epic label to all metrics
    - targetLabel: epic
      replacement: "epic-7-integration-services"
    relabelings:
    # Add service and pod labels
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_service_name]
      targetLabel: service
    - targetLabel: component
      replacement: "integration-services"

---
# Alert Manager Configuration for Integration Services
apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-services-alerting
  namespace: dessai
  labels:
    app.kubernetes.io/name: integration-services-alerting
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: dessai
    epic: "epic-7-integration-services"
data:
  integration-alerting.yml: |
    groups:
    - name: integration-services-notifications
      routes:
      - match:
          epic: "epic-7-integration-services"
        group_by: ['alertname', 'component', 'provider']
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 4h
        receiver: integration-team
        routes:
        - match:
            severity: critical
          receiver: integration-team-critical
        - match:
            component: external-api
          receiver: integration-api-team
    
    receivers:
    - name: integration-team
      slack_configs:
      - api_url: 'SLACK_WEBHOOK_URL'
        channel: '#integration-alerts'
        title: 'Integration Services Alert - {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    
    - name: integration-team-critical
      slack_configs:
      - api_url: 'SLACK_WEBHOOK_URL'
        channel: '#integration-critical'
        title: 'CRITICAL: Integration Services Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
      pagerduty_configs:
      - service_key: 'PAGERDUTY_INTEGRATION_KEY'
    
    - name: integration-api-team
      slack_configs:
      - api_url: 'SLACK_WEBHOOK_URL'
        channel: '#external-api-alerts'
        title: 'External API Integration Alert'
        text: '{{ range .Alerts }}Provider: {{ .Labels.provider }} - {{ .Annotations.description }}{{ end }}'

---
# Log Aggregation Configuration for Integration Services
apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-services-logging
  namespace: dessai
  labels:
    app.kubernetes.io/name: integration-services-logging
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: dessai
    epic: "epic-7-integration-services"
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
    
    [INPUT]
        Name              tail
        Path              /var/log/containers/dessai-integration-services-*.log
        Parser            docker
        Tag               integration.*
        Refresh_Interval  5
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
    
    [FILTER]
        Name                kubernetes
        Match               integration.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off
        Labels              On
    
    [FILTER]
        Name                modify
        Match               integration.*
        Add                 epic epic-7-integration-services
        Add                 service integration-services
    
    [OUTPUT]
        Name  es
        Match integration.*
        Host  elasticsearch.dessai.svc.cluster.local
        Port  9200
        Index integration-services
        Type  _doc
        Logstash_Format On
        Logstash_Prefix integration-services
        Time_Key @timestamp
