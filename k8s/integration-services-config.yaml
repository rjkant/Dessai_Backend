---
# Service Account for Integration Services
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dessai-integration-service-account
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-integration-service-account
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: dessai
    epic: "epic-7-integration-services"
automountServiceAccountToken: true

---
# Role for Integration Services (RBAC)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: dessai
  name: dessai-integration-role
  labels:
    app.kubernetes.io/name: dessai-integration-role
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: dessai
    epic: "epic-7-integration-services"
rules:
# Allow reading ConfigMaps and Secrets
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
# Allow reading service information for health checks
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]
# Allow reading pod information for service discovery
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---
# RoleBinding for Integration Services
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dessai-integration-rolebinding
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-integration-rolebinding
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: dessai
    epic: "epic-7-integration-services"
subjects:
- kind: ServiceAccount
  name: dessai-integration-service-account
  namespace: dessai
roleRef:
  kind: Role
  name: dessai-integration-role
  apiGroup: rbac.authorization.k8s.io

---
# PersistentVolumeClaim for Integration Logs (optional)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: integration-logs-pvc
  namespace: dessai
  labels:
    app.kubernetes.io/name: integration-logs-pvc
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: dessai
    epic: "epic-7-integration-services"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: "standard"  # Adjust based on your cluster's storage classes

---
# ServiceMonitor for Prometheus Monitoring (if using Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dessai-integration-services-monitor
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-integration-services-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: dessai
    epic: "epic-7-integration-services"
    prometheus: dessai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dessai-integration-services
  endpoints:
  - port: integration-api
    path: /api/integrations/health
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: 'integration_.*'
      action: keep
