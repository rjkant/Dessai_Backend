# Integration Services Configuration & Secrets
# Epic 8: Infrastructure & DevOps - Configuration Management for Integration Services
#
# This file contains ConfigMaps and Secrets for our Epic 7: Integration Services
# production deployment with proper secret management and configuration separation.

---
# ConfigMap for Integration Services Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-config
  namespace: dessai
  labels:
    app.kubernetes.io/name: integration-config
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: dessai
    epic: "epic-7-integration-services"
data:
  # ATS Provider Configuration
  GREENHOUSE_API_URL: "https://harvest.greenhouse.io/v1"
  WORKDAY_API_URL: "https://wd2-impl-services1.workday.com"
  BAMBOOHR_API_URL: "https://api.bamboohr.com/api/gateway.php"
  
  # Calendar Provider Configuration
  GOOGLE_CALENDAR_API_URL: "https://www.googleapis.com/calendar/v3"
  MICROSOFT_GRAPH_API_URL: "https://graph.microsoft.com/v1.0"
  
  # OAuth2 Redirect URIs (non-sensitive)
  GOOGLE_REDIRECT_URI: "https://api.dessai.com/api/integrations/calendar/google/callback"
  MICROSOFT_REDIRECT_URI: "https://api.dessai.com/api/integrations/calendar/outlook/callback"
  
  # Rate Limiting Configuration
  RATE_LIMIT_WINDOW_MS: "900000"  # 15 minutes
  RATE_LIMIT_MAX_REQUESTS: "100"
  RATE_LIMIT_GREENHOUSE_REQUESTS: "50"
  RATE_LIMIT_GOOGLE_REQUESTS: "1000"
  RATE_LIMIT_MICROSOFT_REQUESTS: "500"
  
  # Integration Features Configuration
  ATS_SYNC_ENABLED: "true"
  CALENDAR_SYNC_ENABLED: "true"
  WEBHOOK_ENABLED: "true"
  BATCH_PROCESSING_ENABLED: "true"
  
  # Batch Processing Configuration
  BATCH_SIZE_CANDIDATES: "50"
  BATCH_SIZE_JOBS: "25"
  BATCH_SIZE_EVENTS: "100"
  SYNC_INTERVAL_MINUTES: "60"
  
  # Timeout Configuration
  HTTP_TIMEOUT_MS: "30000"
  DATABASE_TIMEOUT_MS: "10000"
  REDIS_TIMEOUT_MS: "5000"
  
  # Logging Configuration
  INTEGRATION_LOG_LEVEL: "info"
  AUDIT_LOG_ENABLED: "true"
  PERFORMANCE_LOG_ENABLED: "true"
  
  # Health Check Configuration
  HEALTH_CHECK_INTERVAL_MS: "30000"
  PROVIDER_HEALTH_CHECK_ENABLED: "true"
  
  # Optional Provider Configuration (for future use)
  WORKDAY_TENANT: ""
  BAMBOOHR_SUBDOMAIN: ""
  SLACK_WORKSPACE_URL: ""
  TEAMS_TENANT_ID: ""

