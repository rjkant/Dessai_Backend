# Dessai Backend - Additional Kubernetes Services

# Execution Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dessai-execution
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-execution
    app.kubernetes.io/component: execution
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: dessai
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dessai-execution
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dessai-execution
        app.kubernetes.io/component: execution
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: dessai-execution
        image: dessai/execution-service:latest
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: dessai-config
              key: NODE_ENV
        - name: PORT
          value: "3001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dessai-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: dessai-secrets
              key: REDIS_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: dessai-secrets
              key: JWT_SECRET
        - name: DOCKER_HOST
          value: "unix:///var/run/docker.sock"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
        - name: temp-dir
          mountPath: /tmp
        - name: code-execution-tmp
          mountPath: /app/tmp
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: temp-dir
        emptyDir: {}
      - name: code-execution-tmp
        emptyDir:
          sizeLimit: 1Gi

---
# Execution Service
apiVersion: v1
kind: Service
metadata:
  name: dessai-execution-service
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-execution
    app.kubernetes.io/component: execution
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3001"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3001
    targetPort: http
  selector:
    app.kubernetes.io/name: dessai-execution

---
# Proctoring Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dessai-proctoring
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-proctoring
    app.kubernetes.io/component: proctoring
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: dessai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dessai-proctoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dessai-proctoring
        app.kubernetes.io/component: proctoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: dessai-proctoring
        image: dessai/proctoring-service:latest
        ports:
        - containerPort: 3002
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: dessai-config
              key: NODE_ENV
        - name: PORT
          value: "3002"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dessai-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: dessai-secrets
              key: REDIS_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: dessai-secrets
              key: JWT_SECRET
        - name: WEBSOCKET_PORT
          value: "3003"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: temp-dir
          mountPath: /tmp
      volumes:
      - name: temp-dir
        emptyDir: {}

---
# Proctoring Service
apiVersion: v1
kind: Service
metadata:
  name: dessai-proctoring-service
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-proctoring
    app.kubernetes.io/component: proctoring
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3002"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3002
    targetPort: http
  - name: websocket
    port: 3003
    targetPort: 3003
  selector:
    app.kubernetes.io/name: dessai-proctoring

---
# HPA for Execution Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dessai-execution-hpa
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-execution
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dessai-execution
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30

---
# HPA for Proctoring Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dessai-proctoring-hpa
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-proctoring
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dessai-proctoring
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 15
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 40
        periodSeconds: 30

---
# PDB for API Service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dessai-api-pdb
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-api
    app.kubernetes.io/component: availability
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dessai-api

---
# PDB for Execution Service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dessai-execution-pdb
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-execution
    app.kubernetes.io/component: availability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dessai-execution

---
# PDB for Proctoring Service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dessai-proctoring-pdb
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-proctoring
    app.kubernetes.io/component: availability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dessai-proctoring

---
# Network Policy for API Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dessai-api-network-policy
  namespace: dessai
  labels:
    app.kubernetes.io/name: dessai-api
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dessai-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: nginx-ingress-controller
    ports:
    - protocol: TCP
      port: 3000
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: dessai-execution
    ports:
    - protocol: TCP
      port: 3001
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: dessai-proctoring
    ports:
    - protocol: TCP
      port: 3002
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80

---
# Network Policy for Database Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-network-policy
  namespace: dessai
  labels:
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: dessai-api
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: dessai-execution
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: dessai-proctoring
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 9187
    - protocol: TCP
      port: 9121
